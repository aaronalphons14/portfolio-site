<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#162032" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGlow)" stroke="url(#primaryGrad)" stroke-width="12" />

  <!-- Inner Subtle Border -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#00f5d4" stroke-width="2" opacity="0.25" />

  <!-- Monogram Logo Mark (A + T Modern Fusion) -->
  <g filter="url(#neonGlow)">
    <!-- Stylized Geometric A -->
    <path d="M256 96 L400 416 L324 416 L284 324 L228 324 L188 416 L112 416 Z M256 210 L234 274 L278 274 Z" fill="url(#primaryGrad)" />
    <!-- T cross-top / Energy beam across the apex -->
    <rect x="176" y="304" width="160" height="20" rx="10" fill="url(#accentGrad)" />
    <!-- Center Core Node -->
    <circle cx="256" cy="180" r="14" fill="#00f5d4" />
  </g>
</svg>
